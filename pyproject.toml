[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qbench"
version = "0.1.0"
description = "Runtime-first inspection and quantized simulation for PyTorch models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
vision = ["torchvision", "timm"]
dashboard = ["streamlit>=1.55", "pandas", "torchvision", "timm", "argon2-cffi>=23.1"]
conformance = ["numpy"]
test = ["pytest>=8"]
browser-test = ["playwright>=1.50"]
docs = ["mkdocs-material>=9.6,<10"]

[project.scripts]
qbench = "qbench.cli:main"
qbench-dashboard = "qbench.dashboard:main"
qbench-admin = "qbench.dashboard.platform.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["qbench*"]
namespaces = false

[tool.setuptools.package-data]
"qbench.conformance_vectors" = ["manifest.json", "*.npz"]
"qbench.data" = ["imagenet_class_index.json"]
"qbench.quantization.cuda" = ["*.cpp", "*.cu", "*.cuh", "*.h", "*.def"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

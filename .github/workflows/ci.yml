name: Package and dashboard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dashboard,conformance,test]" build ruff
      - run: ruff check qbench tests
      - run: python -m pytest -q --junitxml=validation-results.xml
      - run: python -m build --wheel
      - name: Installed-wheel smoke outside checkout
        shell: bash
        run: |
          python -m pip uninstall -y qbench
          python -m pip install --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          python "${GITHUB_WORKSPACE}/scripts/smoke_installed.py"

  browser:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dashboard,browser-test]"
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/smoke_platform_browser.py

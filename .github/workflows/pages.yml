name: Documentation

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "scripts/check_site.py", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "scripts/check_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - run: python scripts/check_site.py
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site
      - name: Publication is disabled
        if: github.event_name != 'pull_request' && vars.QBENCH_PAGES_ENABLED != 'true'
        run: echo '::notice::Documentation validated and uploaded. Publication is disabled; see docs/deployment.md to enable Pages explicitly.'
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.QBENCH_PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
        with:
          enablement: false
      - uses: actions/deploy-pages@v5
        id: deployment
